<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - shanaTavern</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/static/js/utils.js?v=6"></script>
  <script src="/static/js/chat-core.js?v=6"></script>
  <script src="/static/js/api.js?v=6"></script>
  <script>
    window.onAppReady = async (user) => {
      const main = document.getElementById("main-content");
      const manageBlock = user.can_manage_users ? `
        <div class="card" style="max-width:560px;margin-top:1.5rem">
          <h2 style="font-size:1.1rem;margin-bottom:1rem">账号管理</h2>
          <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:1rem">仅当前账号可添加新用户（注册已关闭）。</p>
          <form id="add-user-form">
            <div class="grid" style="grid-template-columns:1fr 1fr;gap:0.75rem">
              <div class="form-group"><label>用户名</label><input id="new-username" required minlength="2" maxlength="32"></div>
              <div class="form-group"><label>密码</label><input id="new-password" type="password" required minlength="4"></div>
            </div>
            <div class="form-group"><label>昵称（可选）</label><input id="new-nickname" maxlength="64"></div>
            <button type="submit" class="btn btn-primary">添加账号</button>
            <p id="add-msg" class="success-msg" style="display:none"></p>
          </form>
          <h3 style="font-size:0.95rem;margin:1.25rem 0 0.75rem">已有账号</h3>
          <div id="user-list" style="font-size:0.9rem;color:var(--text-muted)">加载中…</div>
        </div>` : "";

      main.innerHTML = `
        <div class="page-header"><h1>个人设置</h1></div>
        <div class="card" style="max-width:480px">
          <form id="profile-form">
            <div class="form-group"><label>用户名</label><input value="${escHtml(user.username)}" readonly></div>
            <div class="form-group"><label>昵称（对话中 {{user}} 会用到）</label><input id="nickname" value="${escHtml(user.nickname || "")}" maxlength="64"></div>
            <button type="submit" class="btn btn-primary">保存</button>
            <p id="msg" class="success-msg" style="display:none"></p>
          </form>
        </div>
        ${manageBlock}
      `;

      document.getElementById("profile-form").addEventListener("submit", async e => {
        e.preventDefault();
        await API.put("/api/auth/profile", { nickname: document.getElementById("nickname").value.trim() });
        const msg = document.getElementById("msg");
        msg.textContent = "已保存"; msg.style.display = "block";
      });

      if (user.can_manage_users) {
        loadUserList();
        document.getElementById("add-user-form").addEventListener("submit", async e => {
          e.preventDefault();
          const addMsg = document.getElementById("add-msg");
          try {
            await API.post("/api/auth/users", {
              username: document.getElementById("new-username").value.trim(),
              password: document.getElementById("new-password").value,
              nickname: document.getElementById("new-nickname").value.trim(),
            });
            addMsg.className = "success-msg";
            addMsg.textContent = "账号已添加";
            addMsg.style.display = "block";
            document.getElementById("add-user-form").reset();
            loadUserList();
          } catch (ex) {
            addMsg.className = "error-msg";
            addMsg.textContent = ex.message;
            addMsg.style.display = "block";
          }
        });
      }
    };

    async function loadUserList() {
      const el = document.getElementById("user-list");
      if (!el) return;
      try {
        const users = await API.get("/api/auth/users");
        el.innerHTML = users.length
          ? `<table style="width:100%;border-collapse:collapse"><thead><tr>
              <th style="text-align:left;padding:0.4rem 0;border-bottom:1px solid var(--border)">用户名</th>
              <th style="text-align:left;padding:0.4rem 0;border-bottom:1px solid var(--border)">昵称</th>
            </tr></thead><tbody>${users.map(u => `
              <tr>
                <td style="padding:0.4rem 0">${escHtml(u.username)}</td>
                <td style="padding:0.4rem 0">${escHtml(u.nickname || "—")}</td>
              </tr>`).join("")}</tbody></table>`
          : "暂无账号";
      } catch (ex) {
        el.textContent = ex.message;
      }
    }

    mountShell("settings");
  </script>
</body>
</html>
