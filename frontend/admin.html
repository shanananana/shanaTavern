<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - TavernMixer</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell"></div>
  <script src="/static/js/api.js?v=4"></script>
  <script>
    let currentAdminId = null;
    let usersCache = [];

    function renderUserTable(users) {
      usersCache = users;
      const tbody = document.getElementById("user-table-body");
      if (!tbody) return;
      tbody.innerHTML = users.map(u => `<tr style="border-top:1px solid var(--border)">
        <td style="padding:0.5rem">${u.id}</td>
        <td>${escHtml(u.username)}</td>
        <td>${escHtml(u.nickname)}</td>
        <td>${u.is_admin ? "是" : ""}</td>
        <td>${formatDateTime(u.created_at)}</td>
        <td style="padding:0.5rem">${u.id === currentAdminId
          ? `<span style="color:var(--text-muted);font-size:0.8rem">当前账号</span>`
          : `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button>`}
        </td>
      </tr>`).join("");
    }

    async function deleteUser(id) {
      const u = usersCache.find(x => x.id === id);
      const name = u ? u.username : id;
      if (!confirm(`确定删除用户「${name}」？其角色、对话、收藏等数据将一并清除。`)) return;
      try {
        await API.delete(`/api/admin/users/${id}`);
        const users = await API.get("/api/admin/users");
        renderUserTable(users);
        const countEl = document.getElementById("user-count");
        if (countEl) countEl.textContent = `${users.length} 个注册用户`;
      } catch (ex) {
        alert(ex.message);
      }
    }

    window.deleteUser = deleteUser;

    window.onAppReady = async (user) => {
      if (!user.is_admin) { document.getElementById("main-content").innerHTML = `<div class="empty-state">需要管理员权限</div>`; return; }
      currentAdminId = user.id;
      const main = document.getElementById("main-content");
      const [llm, users] = await Promise.all([
        API.get("/api/admin/llm-status"),
        API.get("/api/admin/users"),
      ]);
      main.innerHTML = `
        <div class="page-header"><h1>管理后台</h1></div>
        <div class="grid" style="margin-bottom:2rem">
          <div class="card">
            <h3>LLM 状态</h3>
            <p>模型: ${escHtml(llm.model)}</p>
            <p>地址: ${escHtml(llm.base_url)}</p>
            <span class="badge ${llm.connected ? "badge-ok" : "badge-err"}">${llm.connected ? "已连接" : "未连接"}</span>
            ${llm.available_models.length ? `<p style="margin-top:0.5rem;font-size:0.8rem;color:var(--text-muted)">可用: ${llm.available_models.join(", ")}</p>` : ""}
          </div>
          <div class="card">
            <h3>用户</h3>
            <p id="user-count">${users.length} 个注册用户</p>
          </div>
        </div>
        <h2 style="margin-bottom:0.75rem;font-size:1.1rem">添加用户</h2>
        <div class="card" style="max-width:480px;margin-bottom:2rem">
          <form id="add-user-form">
            <div class="form-group"><label>用户名</label><input id="new-username" required minlength="2"></div>
            <div class="form-group"><label>密码</label><input id="new-password" type="password" required minlength="4"></div>
            <div class="form-group"><label>昵称</label><input id="new-nickname"></div>
            <div class="form-group"><label><input type="checkbox" id="new-admin"> 管理员</label></div>
            <button type="submit" class="btn btn-primary btn-sm">创建账号</button>
            <p id="add-msg" class="success-msg" style="display:none"></p>
          </form>
        </div>
        <h2 style="margin-bottom:0.75rem;font-size:1.1rem">用户列表</h2>
        <div class="card">
          <table style="width:100%;border-collapse:collapse;font-size:0.9rem">
            <thead><tr style="text-align:left;color:var(--text-muted)">
              <th style="padding:0.5rem">ID</th><th>用户名</th><th>昵称</th><th>管理员</th><th>注册时间</th><th>操作</th>
            </tr></thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
        <p style="margin-top:1.5rem;color:var(--text-muted);font-size:0.85rem">
          注册已关闭。命令行添加：<code>python scripts/add_user.py 用户名 密码</code>
        </p>
      `;
      renderUserTable(users);
      document.getElementById("add-user-form").addEventListener("submit", async e => {
        e.preventDefault();
        await API.post("/api/admin/users", {
          username: document.getElementById("new-username").value.trim(),
          password: document.getElementById("new-password").value,
          nickname: document.getElementById("new-nickname").value.trim(),
          is_admin: document.getElementById("new-admin").checked,
        });
        const msg = document.getElementById("add-msg");
        msg.textContent = "账号已创建"; msg.style.display = "block";
        location.reload();
      });
    };
    mountShell("admin");
  </script>
</body>
</html>
